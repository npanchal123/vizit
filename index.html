<html lang="en" data-theme="system">

    <meta charset="UTF-8" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="canonical" href="__SITE_URL__" />
    <!-- How the link looks when shared on WhatsApp, Instagram, X and others. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Viz it" />
    <meta property="og:title" content="Viz it · Visualize how you want to feel" />
    <meta property="og:description" content="Write how you feel and what you’d like to imagine, and Viz it writes a guided visualization just for you. Free, private and offline, in 9 languages." />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f3fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090d1f" media="(prefers-color-scheme: dark)" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Viz it · Visualize how you want to feel</title>
    <script>
      // Apply the saved theme before first paint so there's no flash of the wrong colors.
      try {
        var saved = JSON.parse(localStorage.getItem('moodcanvas.theme'));
        if (['light', 'dark', 'contrast', 'system'].indexOf(saved) >= 0) document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
